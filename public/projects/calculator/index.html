<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulyator — Mini loyiha</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <a href="../../" class="back-link">← Portfolioga qaytish</a>
      <div class="calculator">
        <div class="display">
          <div id="expression" class="expression"></div>
          <div id="result" class="result">0</div>
        </div>
        <div class="keys">
          <button data-action="clear" class="key op">AC</button>
          <button data-action="sign" class="key op">±</button>
          <button data-action="percent" class="key op">%</button>
          <button data-action="divide" class="key op">÷</button>

          <button data-num="7" class="key">7</button>
          <button data-num="8" class="key">8</button>
          <button data-num="9" class="key">9</button>
          <button data-action="multiply" class="key op">×</button>

          <button data-num="4" class="key">4</button>
          <button data-num="5" class="key">5</button>
          <button data-num="6" class="key">6</button>
          <button data-action="subtract" class="key op">−</button>

          <button data-num="1" class="key">1</button>
          <button data-num="2" class="key">2</button>
          <button data-num="3" class="key">3</button>
          <button data-action="add" class="key op">+</button>

          <button data-num="0" class="key zero">0</button>
          <button data-action="decimal" class="key">.</button>
          <button data-action="equals" class="key equals">=</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
