<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ob-havo — Mini loyiha</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <a href="../../" class="back-link">← Portfolioga qaytish</a>
      <h1>Ob-havo</h1>
      <p class="subtitle">Shahar nomini kiriting va joriy ob-havoni ko'ring</p>

      <form id="search-form" class="search-form">
        <input
          type="text"
          id="city-input"
          placeholder="Masalan: Tashkent"
          autocomplete="off"
          required
        />
        <button type="submit">Qidirish</button>
      </form>

      <div id="status" class="status"></div>

      <div id="weather-card" class="weather-card hidden">
        <div class="location" id="location"></div>
        <div class="temp" id="temp"></div>
        <div class="description" id="description"></div>
        <div class="details">
          <div>
            <span class="label">Shamol</span>
            <span id="wind"></span>
          </div>
          <div>
            <span class="label">Namlik</span>
            <span id="humidity"></span>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
